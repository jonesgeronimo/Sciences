<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vitesse, distance, temps — Entraînement (réponse libre)</title>
<style>
  :root{
    --bleu:#2b6cb0;
    --bleu-clair:#ebf4ff;
    --vert:#2f855a;
    --vert-clair:#f0fff4;
    --rouge:#c53030;
    --rouge-clair:#fff5f5;
    --gris:#4a5568;
    --gris-clair:#f7fafc;
    --bord:#cbd5e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Verdana, Arial, sans-serif;
    background:var(--gris-clair);
    color:#1a202c;
    display:flex;
    justify-content:center;
    padding:16px;
  }
  .carte{
    background:#ffffff;
    border-radius:20px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    max-width:560px;
    width:100%;
    padding:28px 24px 32px;
  }
  h1{
    font-size:22px;
    text-align:center;
    color:var(--bleu);
    margin:0 0 18px;
  }
  .progression{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .progression-texte{
    font-size:15px;
    color:var(--gris);
    white-space:nowrap;
  }
  .barre-fond{
    flex:1;
    height:10px;
    background:#e2e8f0;
    border-radius:6px;
    overflow:hidden;
  }
  .barre-remplie{
    height:100%;
    background:var(--bleu);
    border-radius:6px;
    transition:width 0.3s ease;
  }
  .rappel{
    background:var(--bleu-clair);
    border-left:5px solid var(--bleu);
    border-radius:8px;
    padding:12px 14px;
    font-size:16px;
    color:#2c5282;
    margin-bottom:20px;
    text-align:center;
  }
  .enonce{
    font-size:19px;
    line-height:1.5;
    text-align:center;
    margin-bottom:14px;
  }
  .donnees{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .donnee{
    background:var(--gris-clair);
    border:2px solid var(--bord);
    border-radius:12px;
    padding:10px 16px;
    text-align:center;
    min-width:110px;
  }
  .donnee .etiquette{
    font-size:13px;
    color:var(--gris);
    display:block;
  }
  .donnee .valeur{
    font-size:22px;
    font-weight:700;
    color:#1a202c;
  }
  .question{
    font-size:21px;
    font-weight:600;
    text-align:center;
    margin-bottom:20px;
  }
  .zone-reponse{
    display:flex;
    align-items:stretch;
    gap:10px;
  }
  .zone-reponse input{
    flex:1;
    min-width:0;
    font-size:24px;
    text-align:center;
    padding:14px;
    border-radius:14px;
    border:2px solid var(--bord);
    font-family:inherit;
  }
  .zone-reponse input:focus{
    outline:none;
    border-color:var(--bleu);
  }
  .zone-reponse .unite{
    display:flex;
    align-items:center;
    font-size:20px;
    font-weight:700;
    color:var(--gris);
    padding:0 4px;
    min-width:52px;
  }
  .bouton-valider{
    margin-top:14px;
    width:100%;
    padding:15px;
    font-size:19px;
    font-weight:700;
    color:#ffffff;
    background:var(--bleu);
    border:none;
    border-radius:14px;
    cursor:pointer;
  }
  .bouton-valider:disabled{
    background:#a0aec0;
    cursor:default;
  }
  .retour{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:17px;
    text-align:center;
    display:none;
  }
  .retour.bon{
    background:var(--vert-clair);
    color:#22543d;
    display:block;
  }
  .retour.mauvais{
    background:var(--rouge-clair);
    color:#822727;
    display:block;
  }
  .retour .calcul{
    display:block;
    margin-top:6px;
    font-size:16px;
    font-weight:700;
  }
  .suite{
    margin-top:18px;
    width:100%;
    padding:15px;
    font-size:19px;
    font-weight:700;
    color:#ffffff;
    background:var(--bleu);
    border:none;
    border-radius:14px;
    cursor:pointer;
    display:none;
  }
  .suite.visible{
    display:block;
  }
  .fin{
    text-align:center;
  }
  .fin .score{
    font-size:48px;
    font-weight:800;
    color:var(--bleu);
    margin:10px 0;
  }
  .fin .message{
    font-size:19px;
    margin-bottom:22px;
  }
  .recommencer{
    padding:14px 22px;
    font-size:18px;
    font-weight:700;
    color:#ffffff;
    background:var(--vert);
    border:none;
    border-radius:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="carte">
  <h1>Vitesse, distance, temps</h1>

  <div id="zoneJeu">
    <div class="progression">
      <span class="progression-texte" id="texteProgression">Question 1 / 30</span>
      <div class="barre-fond"><div class="barre-remplie" id="barreRemplie" style="width:0%"></div></div>
    </div>

    <div class="rappel" id="rappelFormule">vitesse = distance ÷ temps</div>

    <div class="enonce" id="enonce"></div>

    <div class="donnees" id="donnees"></div>

    <div class="question" id="question"></div>

    <div class="zone-reponse">
      <input type="text" inputmode="numeric" id="champReponse" placeholder="ta réponse" autocomplete="off">
      <span class="unite" id="uniteReponse"></span>
    </div>
    <button class="bouton-valider" id="boutonValider" disabled>Valider</button>

    <div class="retour" id="retour"></div>

    <button class="suite" id="boutonSuite">Suivant →</button>
  </div>

  <div class="fin" id="zoneFin" style="display:none">
    <div class="message">Activité terminée, bravo pour ton travail !</div>
    <div class="score" id="scoreFinal"></div>
    <div class="message" id="messageFinal"></div>
    <button class="recommencer" id="boutonRecommencer">Recommencer</button>
  </div>
</div>

<script>
  const questions = [
    {sec:'v', d:20,  t:10, ans:2},
    {sec:'v', d:30,  t:10, ans:3},
    {sec:'v', d:40,  t:10, ans:4},
    {sec:'v', d:50,  t:10, ans:5},
    {sec:'v', d:24,  t:8,  ans:3},
    {sec:'v', d:54,  t:9,  ans:6},
    {sec:'v', d:56,  t:7,  ans:8},
    {sec:'v', d:90,  t:9,  ans:10},
    {sec:'v', d:48,  t:6,  ans:8},
    {sec:'v', d:63,  t:9,  ans:7},
    {sec:'v', d:88,  t:11, ans:8},
    {sec:'v', d:108, t:9,  ans:12},
    {sec:'d', v:3,   t:2,  ans:6},
    {sec:'d', v:6,   t:3,  ans:18},
    {sec:'d', v:7,   t:4,  ans:28},
    {sec:'d', v:9,   t:3,  ans:27},
    {sec:'d', v:8,   t:6,  ans:48},
    {sec:'d', v:11,  t:4,  ans:44},
    {sec:'t', d:18,  v:6,  ans:3},
    {sec:'t', d:35,  v:7,  ans:5},
    {sec:'t', d:48,  v:8,  ans:6},
    {sec:'t', d:54,  v:9,  ans:6},
    {sec:'t', d:77,  v:11, ans:7},
    {sec:'t', d:96,  v:12, ans:8},
    {sec:'v', d:170, t:17, ans:10},
    {sec:'d', v:13,  t:5,  ans:65},
    {sec:'t', d:110, v:10, ans:11},
    {sec:'v', d:144, t:12, ans:12},
    {sec:'d', v:12,  t:12, ans:144},
    {sec:'t', d:132, v:11, ans:12}
  ];

  const infosSection = {
    v: {
      formule: "vitesse = distance ÷ temps",
      texte: q => `Une voiture parcourt ${q.d} m en ${q.t} s.`,
      question: "Quelle est sa vitesse ?",
      unite: "m/s",
      donnees: q => [ {etiquette:"Distance", valeur:q.d+" m"}, {etiquette:"Temps", valeur:q.t+" s"} ],
      calcul: q => `${q.d} ÷ ${q.t} = ${q.ans} m/s`
    },
    d: {
      formule: "distance = vitesse × temps",
      texte: q => `Une voiture roule à ${q.v} m/s pendant ${q.t} s.`,
      question: "Quelle distance parcourt-elle ?",
      unite: "m",
      donnees: q => [ {etiquette:"Vitesse", valeur:q.v+" m/s"}, {etiquette:"Temps", valeur:q.t+" s"} ],
      calcul: q => `${q.v} × ${q.t} = ${q.ans} m`
    },
    t: {
      formule: "temps = distance ÷ vitesse",
      texte: q => `Une voiture parcourt ${q.d} m à la vitesse de ${q.v} m/s.`,
      question: "Combien de temps met-elle ?",
      unite: "s",
      donnees: q => [ {etiquette:"Distance", valeur:q.d+" m"}, {etiquette:"Vitesse", valeur:q.v+" m/s"} ],
      calcul: q => `${q.d} ÷ ${q.v} = ${q.ans} s`
    }
  };

  let indexActuel = 0;
  let score = 0;
  let dejaValide = false;

  const elTexteProgression = document.getElementById('texteProgression');
  const elBarreRemplie = document.getElementById('barreRemplie');
  const elRappelFormule = document.getElementById('rappelFormule');
  const elEnonce = document.getElementById('enonce');
  const elDonnees = document.getElementById('donnees');
  const elQuestion = document.getElementById('question');
  const champReponse = document.getElementById('champReponse');
  const elUniteReponse = document.getElementById('uniteReponse');
  const boutonValider = document.getElementById('boutonValider');
  const elRetour = document.getElementById('retour');
  const boutonSuite = document.getElementById('boutonSuite');
  const zoneJeu = document.getElementById('zoneJeu');
  const zoneFin = document.getElementById('zoneFin');

  function afficherQuestion(){
    const q = questions[indexActuel];
    const infos = infosSection[q.sec];

    dejaValide = false;
    elTexteProgression.textContent = `Question ${indexActuel + 1} / ${questions.length}`;
    elBarreRemplie.style.width = ((indexActuel) / questions.length * 100) + "%";
    elRappelFormule.textContent = "Rappel : " + infos.formule;
    elEnonce.textContent = infos.texte(q);
    elQuestion.textContent = infos.question;
    elUniteReponse.textContent = infos.unite;

    elDonnees.innerHTML = "";
    infos.donnees(q).forEach(d => {
      const div = document.createElement('div');
      div.className = 'donnee';
      div.innerHTML = `<span class="etiquette">${d.etiquette}</span><span class="valeur">${d.valeur}</span>`;
      elDonnees.appendChild(div);
    });

    elRetour.className = 'retour';
    elRetour.textContent = '';
    boutonSuite.classList.remove('visible');

    champReponse.value = '';
    champReponse.disabled = false;
    champReponse.className = '';
    boutonValider.disabled = true;
    boutonValider.style.display = 'block';
    champReponse.focus();
  }

  champReponse.addEventListener('input', () => {
    boutonValider.disabled = champReponse.value.trim() === '';
  });

  champReponse.addEventListener('keydown', (evenement) => {
    if(evenement.key === 'Enter' && !boutonValider.disabled && !dejaValide){
      valider();
    }
  });

  boutonValider.addEventListener('click', valider);

  function valider(){
    if(dejaValide) return;
    const q = questions[indexActuel];
    const infos = infosSection[q.sec];
    const saisie = champReponse.value.trim().replace(',', '.');
    const valeurSaisie = parseFloat(saisie);

    dejaValide = true;
    champReponse.disabled = true;
    boutonValider.style.display = 'none';

    if(!isNaN(valeurSaisie) && Math.abs(valeurSaisie - q.ans) < 0.001){
      score++;
      champReponse.classList.add('correcte-champ');
      elRetour.className = 'retour bon';
      elRetour.innerHTML = "✅ Bravo, c'est la bonne réponse !" + `<span class="calcul">${infos.calcul(q)}</span>`;
    } else {
      elRetour.className = 'retour mauvais';
      elRetour.innerHTML = `❌ Pas tout à fait. La bonne réponse était <strong>${q.ans} ${infos.unite}</strong>.` + `<span class="calcul">${infos.calcul(q)}</span>`;
    }

    boutonSuite.classList.add('visible');
  }

  boutonSuite.addEventListener('click', () => {
    indexActuel++;
    if(indexActuel < questions.length){
      afficherQuestion();
    } else {
      terminerActivite();
    }
  });

  function terminerActivite(){
    zoneJeu.style.display = 'none';
    zoneFin.style.display = 'block';
    document.getElementById('scoreFinal').textContent = score + " / " + questions.length;
    let message = "";
    if(score === questions.length){
      message = "Parfait, toutes les réponses sont justes !";
    } else if(score >= questions.length * 0.7){
      message = "Très bon travail, continue comme ça !";
    } else if(score >= questions.length * 0.4){
      message = "Bon travail, tu progresses, continue à t'entraîner.";
    } else {
      message = "Bon début, n'hésite pas à recommencer pour t'entraîner encore.";
    }
    document.getElementById('messageFinal').textContent = message;
  }

  document.getElementById('boutonRecommencer').addEventListener('click', () => {
    indexActuel = 0;
    score = 0;
    zoneFin.style.display = 'none';
    zoneJeu.style.display = 'block';
    afficherQuestion();
  });

  afficherQuestion();
</script>
</body>
</html>
