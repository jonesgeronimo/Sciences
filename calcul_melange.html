<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/Sciences/">
<title>Vitesse, distance, temps — mélange — Sciences</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="brand" href="index.html">Sciences</a>
  <a href="index.html">Accueil</a>
  <a href="activites.html">Activités</a>
  <a href="cours.html">Cours</a>
</nav>

<main>
  <h1>Vitesse, distance, temps — mélange</h1>
  <p class="sub">15 exercices, du plus simple au plus difficile — que du calcul mental.</p>

  <div class="formula-reminder">v = d ÷ t &nbsp;·&nbsp; d = v × t &nbsp;·&nbsp; t = d ÷ v</div>

  <div class="progress-row">
    <span id="prog-label">Exercice 1 / 15</span>
    <span id="prog-score">0 point(s)</span>
  </div>
  <div class="progress-bar-bg"><div id="prog-fill" class="progress-bar-fill" style="width:0%;"></div></div>

  <div id="exercise-card" class="card">
    <div class="badge-row">
      <span class="badge" id="step-badge">Étape 1</span>
      <span class="badge" id="niveau-badge">Niveau 1</span>
    </div>
    <div class="ex-title" id="ex-title"></div>
    <div class="statement" id="ex-statement"></div>

    <div class="inputs-grid">
      <div class="input-group">
        <label for="inp_ans" id="unit-label">v (m/s)</label>
        <input id="inp_ans" type="number" step="any" placeholder="…" autocomplete="off">
        <div class="inline-feedback" id="fb_ans"></div>
      </div>
    </div>

    <div class="btn-row" style="justify-content:flex-start; gap:10px; flex-wrap:wrap;">
      <button class="btn-secondary" onclick="showHint()">Indice</button>
      <button onclick="checkAnswers()">Vérifier</button>
      <button class="hidden" id="btn-next" onclick="nextExercise()">Suivant →</button>
    </div>

    <div class="global-feedback" id="global-fb"></div>
  </div>

  <div id="score-screen" class="card final hidden">
    <div class="score-ring" id="final-score-circle"></div>
    <p class="ex-title">Terminé</p>
    <p class="sub" id="final-msg"></p>
    <button onclick="restart()">Recommencer</button>
  </div>
</main>

<footer>Sciences — Activités interactives</footer>

<script>
// symbole: 'v' (vitesse), 'd' (distance) ou 't' (temps) — détermine la formule et l'unité de réponse.
// Tous les calculs sont exacts et faisables de tête (aucune conversion d'unité).
const exercises = [
  // ---------- Niveau 1 ----------
  {
    niveau: 1, etoiles: "★", symbole: "v", unit: "m/s",
    title: "Échauffement — une voiture",
    statement: "Une voiture parcourt <span class='val'>10 m</span> en <span class='val'>10 s</span>. Calcule sa vitesse.",
    hint: "v = d ÷ t.",
    hint2: "v = 10 ÷ 10",
    answer: 1, tol: 0.05,
    explanation: "v = 10 ÷ 10 = <b>1 m/s</b>"
  },
  {
    niveau: 1, etoiles: "★", symbole: "d", unit: "m",
    title: "Échauffement — un cycliste",
    statement: "Un cycliste roule à <span class='val'>5 m/s</span> pendant <span class='val'>2 s</span>. Quelle distance parcourt-il ?",
    hint: "d = v × t.",
    hint2: "d = 5 × 2",
    answer: 10, tol: 0.3,
    explanation: "d = 5 × 2 = <b>10 m</b>"
  },
  {
    niveau: 1, etoiles: "★", symbole: "t", unit: "s",
    title: "Échauffement — un coureur",
    statement: "Un coureur parcourt <span class='val'>20 m</span> à <span class='val'>5 m/s</span>. Combien de temps met-il ?",
    hint: "t = d ÷ v.",
    hint2: "t = 20 ÷ 5",
    answer: 4, tol: 0.2,
    explanation: "t = 20 ÷ 5 = <b>4 s</b>"
  },
  // ---------- Niveau 2 ----------
  {
    niveau: 2, etoiles: "★★", symbole: "v", unit: "m/s",
    title: "Un peu plus grand — une voiture",
    statement: "Une voiture parcourt <span class='val'>60 m</span> en <span class='val'>10 s</span>. Calcule sa vitesse.",
    hint: "v = d ÷ t.",
    hint2: "v = 60 ÷ 10",
    answer: 6, tol: 0.2,
    explanation: "v = 60 ÷ 10 = <b>6 m/s</b>"
  },
  {
    niveau: 2, etoiles: "★★", symbole: "d", unit: "m",
    title: "Un peu plus grand — un cycliste",
    statement: "Un cycliste roule à <span class='val'>8 m/s</span> pendant <span class='val'>4 s</span>. Quelle distance parcourt-il ?",
    hint: "d = v × t.",
    hint2: "d = 8 × 4",
    answer: 32, tol: 0.5,
    explanation: "d = 8 × 4 = <b>32 m</b>"
  },
  {
    niveau: 2, etoiles: "★★", symbole: "t", unit: "s",
    title: "Un peu plus grand — un coureur",
    statement: "Un coureur parcourt <span class='val'>48 m</span> à <span class='val'>8 m/s</span>. Combien de temps met-il ?",
    hint: "t = d ÷ v.",
    hint2: "t = 48 ÷ 8",
    answer: 6, tol: 0.2,
    explanation: "t = 48 ÷ 8 = <b>6 s</b>"
  },
  // ---------- Niveau 3 ----------
  {
    niveau: 3, etoiles: "★★★", symbole: "v", unit: "m/s",
    title: "Tables de multiplication — une voiture",
    statement: "Une voiture parcourt <span class='val'>72 m</span> en <span class='val'>8 s</span>. Calcule sa vitesse.",
    hint: "v = d ÷ t.",
    hint2: "v = 72 ÷ 8",
    answer: 9, tol: 0.2,
    explanation: "v = 72 ÷ 8 = <b>9 m/s</b>"
  },
  {
    niveau: 3, etoiles: "★★★", symbole: "d", unit: "m",
    title: "Tables de multiplication — un bus",
    statement: "Un bus roule à <span class='val'>9 m/s</span> pendant <span class='val'>6 s</span>. Quelle distance parcourt-il ?",
    hint: "d = v × t.",
    hint2: "d = 9 × 6",
    answer: 54, tol: 0.5,
    explanation: "d = 9 × 6 = <b>54 m</b>"
  },
  {
    niveau: 3, etoiles: "★★★", symbole: "t", unit: "s",
    title: "Tables de multiplication — un train",
    statement: "Un train parcourt <span class='val'>63 m</span> à <span class='val'>9 m/s</span>. Combien de temps met-il ?",
    hint: "t = d ÷ v.",
    hint2: "t = 63 ÷ 9",
    answer: 7, tol: 0.2,
    explanation: "t = 63 ÷ 9 = <b>7 s</b>"
  },
  // ---------- Niveau 4 ----------
  {
    niveau: 4, etoiles: "★★★★", symbole: "v", unit: "m/s",
    title: "Nombres plus grands — un TGV",
    statement: "Un TGV parcourt <span class='val'>96 m</span> en <span class='val'>8 s</span>. Calcule sa vitesse.",
    hint: "v = d ÷ t.",
    hint2: "v = 96 ÷ 8",
    answer: 12, tol: 0.3,
    explanation: "v = 96 ÷ 8 = <b>12 m/s</b>"
  },
  {
    niveau: 4, etoiles: "★★★★", symbole: "d", unit: "m",
    title: "Nombres plus grands — un camion",
    statement: "Un camion roule à <span class='val'>11 m/s</span> pendant <span class='val'>4 s</span>. Quelle distance parcourt-il ?",
    hint: "d = v × t.",
    hint2: "d = 11 × 4",
    answer: 44, tol: 0.5,
    explanation: "d = 11 × 4 = <b>44 m</b>"
  },
  {
    niveau: 4, etoiles: "★★★★", symbole: "t", unit: "s",
    title: "Nombres plus grands — une voiture",
    statement: "Une voiture parcourt <span class='val'>84 m</span> à <span class='val'>12 m/s</span>. Combien de temps met-elle ?",
    hint: "t = d ÷ v.",
    hint2: "t = 84 ÷ 12",
    answer: 7, tol: 0.2,
    explanation: "t = 84 ÷ 12 = <b>7 s</b>"
  },
  // ---------- Niveau 5 : défi ----------
  {
    niveau: 5, etoiles: "★★★★★", symbole: "v", unit: "m/s",
    title: "Défi — une voiture",
    statement: "Une voiture parcourt <span class='val'>150 m</span> en <span class='val'>15 s</span>. Calcule sa vitesse.",
    hint: "v = d ÷ t.",
    hint2: "v = 150 ÷ 15",
    answer: 10, tol: 0.3,
    explanation: "v = 150 ÷ 15 = <b>10 m/s</b>"
  },
  {
    niveau: 5, etoiles: "★★★★★", symbole: "d", unit: "m",
    title: "Défi — un camion",
    statement: "Un camion roule à <span class='val'>13 m/s</span> pendant <span class='val'>5 s</span>. Quelle distance parcourt-il ?",
    hint: "d = v × t.",
    hint2: "d = 13 × 5",
    answer: 65, tol: 0.5,
    explanation: "d = 13 × 5 = <b>65 m</b>"
  },
  {
    niveau: 5, etoiles: "★★★★★", symbole: "t", unit: "s",
    title: "Défi — un avion",
    statement: "Un avion parcourt <span class='val'>132 m</span> à <span class='val'>11 m/s</span>. Combien de temps met-il ?",
    hint: "t = d ÷ v.",
    hint2: "t = 132 ÷ 11",
    answer: 12, tol: 0.3,
    explanation: "t = 132 ÷ 11 = <b>12 s</b>"
  }
];

const SYMBOLE_LABEL = { v: "v", d: "d", t: "t" };

let current = 0, score = 0, checked = false, hintLevel = 0;

function renderExercise() {
  const ex = exercises[current];
  checked = false; hintLevel = 0;
  document.getElementById('step-badge').textContent = `Étape ${current+1}`;
  document.getElementById('niveau-badge').textContent = `Niveau ${ex.niveau} ${ex.etoiles}`;
  document.getElementById('ex-title').textContent = ex.title;
  document.getElementById('ex-statement').innerHTML = ex.statement;
  document.getElementById('unit-label').textContent = `${SYMBOLE_LABEL[ex.symbole]} (${ex.unit})`;

  const inp = document.getElementById('inp_ans');
  inp.value = '';
  inp.placeholder = `… ${ex.unit}`;
  inp.classList.remove('ok','err');
  document.getElementById('fb_ans').textContent = '';
  document.getElementById('fb_ans').className = 'inline-feedback';

  document.getElementById('global-fb').className = 'global-feedback';
  document.getElementById('global-fb').textContent = '';
  document.getElementById('btn-next').classList.add('hidden');
  updateProgress();
  inp.focus();
}

function updateProgress() {
  document.getElementById('prog-label').textContent = `Exercice ${current+1} / ${exercises.length}`;
  document.getElementById('prog-score').textContent = `${score} point(s)`;
  document.getElementById('prog-fill').style.width = `${(current/exercises.length)*100}%`;
}

function checkAnswers() {
  if (checked) return;
  const ex = exercises[current];
  const inp = document.getElementById('inp_ans');
  const fb = document.getElementById('fb_ans');
  const v = parseFloat(inp.value);
  const gfb = document.getElementById('global-fb');

  if (!isNaN(v) && Math.abs(v - ex.answer) <= ex.tol) {
    inp.classList.add('ok'); inp.classList.remove('err');
    fb.textContent = 'Correct'; fb.className = 'inline-feedback ok';
    score++; checked = true;
    gfb.innerHTML = 'Bravo ! ' + ex.explanation;
    gfb.className = 'global-feedback ok';
    document.getElementById('btn-next').classList.remove('hidden');
    updateProgress();
  } else {
    inp.classList.add('err'); inp.classList.remove('ok');
    fb.textContent = isNaN(v) ? 'Entre une valeur' : 'Pas encore…';
    fb.className = 'inline-feedback err';
    gfb.textContent = "Pas encore… Relis l'indice et réessaie.";
    gfb.className = 'global-feedback err';
  }
}

function showHint() {
  const ex = exercises[current];
  const gfb = document.getElementById('global-fb');
  gfb.innerHTML = hintLevel === 0 ? ex.hint : ex.hint2;
  gfb.className = 'global-feedback info';
  hintLevel = (hintLevel + 1) % 2;
}

function nextExercise() {
  current++;
  if (current >= exercises.length) showScore();
  else renderExercise();
}

function showScore() {
  document.getElementById('exercise-card').classList.add('hidden');
  document.getElementById('score-screen').classList.remove('hidden');
  const pct = Math.round((score / exercises.length) * 100);
  document.getElementById('final-score-circle').textContent = `${score}/${exercises.length}`;
  const msg = pct >= 80 ? "Excellent, tu maîtrises les trois formules."
             : pct >= 50 ? "Bien. Continue à t'entraîner sur les trois formules."
             : "Continue à t'entraîner, tu vas y arriver.";
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-score').textContent = `${score} point(s)`;
}

function restart() {
  current = 0; score = 0;
  document.getElementById('score-screen').classList.add('hidden');
  document.getElementById('exercise-card').classList.remove('hidden');
  renderExercise();
}

renderExercise();
</script>
</body>
</html>
