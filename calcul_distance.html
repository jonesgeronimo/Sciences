<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculer une distance – Calcul guidé</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #f5c842;
    --accent2: #4ec9b0;
    --danger: #ff6b6b;
    --success: #6bffb8;
    --text: #e8eaf0;
    --muted: #6b7080;
    --border: #2e3248;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { margin-top: 6px; color: var(--muted); font-size: 0.9rem; font-family: 'DM Mono', monospace; }

  .home-link { display:block; text-align:center; margin-bottom:16px; font-size:13px; color:#999; text-decoration:none; }

  .formula-reminder {
    max-width: 580px; margin: 0 auto 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    text-align: center; font-family: 'DM Mono', monospace; font-size: 0.9rem; color: var(--accent2);
  }
  .unit-warning {
    max-width: 580px; margin: 0 auto 20px; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--danger);
  }

  .progress-bar-wrap { max-width: 580px; margin: 0 auto 28px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-family: 'DM Mono', monospace; }
  .progress-bar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s ease; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 580px;
    margin: 0 auto;
    padding: 24px 20px 20px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .badge-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .step-badge {
    display: inline-block; background: var(--surface2); color: var(--accent);
    font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 3px 10px;
    border-radius: 99px; border: 1px solid var(--border);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .niveau-badge {
    display: inline-block; font-family: 'DM Mono', monospace; font-size: 0.72rem;
    padding: 3px 10px; border-radius: 99px; color: #111; font-weight: 500;
    letter-spacing: 0.04em;
  }
  .card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
  .statement { font-size: 0.95rem; color: var(--text); margin-bottom: 18px; line-height: 1.55; }
  .statement .val { color: var(--accent2); font-weight: 700; }
  .statement .unit-ask { color: var(--accent); font-weight: 700; }

  .inputs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label { font-size: 0.78rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .input-group label span { color: var(--accent2); font-weight: 500; }
  .input-group input {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 12px; color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 1rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
  }
  .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,200,66,0.12); }
  .input-group input.ok { border-color: var(--success); background: rgba(107,255,184,0.05); }
  .input-group input.err { border-color: var(--danger); background: rgba(255,107,107,0.05); }
  .inline-feedback { font-size: 0.75rem; font-family: 'DM Mono', monospace; min-height: 14px; }
  .inline-feedback.ok { color: var(--success); }
  .inline-feedback.err { color: var(--danger); }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
    border: none; border-radius: 10px; padding: 11px 22px; cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  .btn-check { background: var(--accent); color: #111; flex: 1; }
  .btn-hint { background: var(--surface2); color: var(--accent2); border: 1px solid var(--border); }
  .btn-next { background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #111; flex: 1; display: none; }
  .btn-next.visible { display: block; }

  .global-feedback {
    margin-top: 14px; padding: 11px 14px; border-radius: 10px;
    font-size: 0.85rem; font-family: 'DM Mono', monospace; display: none;
    line-height: 1.5; animation: fadeIn 0.3s ease;
  }
  .global-feedback.ok { background: rgba(107,255,184,0.08); border: 1px solid rgba(107,255,184,0.3); color: var(--success); display: block; }
  .global-feedback.err { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.3); color: var(--danger); display: block; }
  .global-feedback.info { background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.3); color: #c4b5fd; display: block; }

  #score-screen { display: none; text-align: center; max-width: 560px; margin: 0 auto; padding: 32px 24px; }
  #score-screen h2 {
    font-size: 2rem; font-weight: 800;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px;
  }
  #score-screen p { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.9rem; margin-bottom: 24px; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px; font-size: 2rem; font-weight: 800; color: var(--accent);
    box-shadow: 0 0 32px rgba(245,200,66,0.2);
  }
  .btn-restart { background: var(--accent); color: #111; padding: 13px 32px; font-size: 1rem; border-radius: 12px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <h1>Calculer une distance</h1>
  <p>15 exercices, du plus simple au plus difficile</p>
</header>
<a href="https://jonesgeronimo.github.io/Sciences" class="home-link">← Accueil</a>

<div class="formula-reminder">d = v × t &nbsp; · &nbsp; 1 km = 1000 m &nbsp; · &nbsp; 1 h = 3600 s &nbsp; · &nbsp; 1 min = 60 s</div>
<div class="unit-warning">⚠ L'unité demandée (m ou km) change selon l'exercice — lis bien la question !</div>

<div class="progress-bar-wrap">
  <div class="progress-label">
    <span id="prog-label">Exercice 1 / 15</span>
    <span id="prog-score">0 point(s)</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div id="exercise-card" class="card">
  <div class="badge-row">
    <div class="step-badge" id="step-badge">Étape 1</div>
    <div class="niveau-badge" id="niveau-badge">Niveau 1</div>
  </div>
  <h2 id="ex-title"></h2>
  <div class="statement" id="ex-statement"></div>
  <div class="inputs-grid">
    <div class="input-group">
      <label for="inp_ans"><span id="unit-label">d (m)</span></label>
      <input id="inp_ans" type="number" step="any" placeholder="…" autocomplete="off">
      <div class="inline-feedback" id="fb_ans"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-hint" onclick="showHint()">💡 Indice</button>
    <button class="btn-check" onclick="checkAnswers()">Vérifier</button>
    <button class="btn-next visible" id="btn-next" onclick="nextExercise()" style="display:none">Suivant →</button>
  </div>
  <div class="global-feedback" id="global-fb"></div>
</div>

<div id="score-screen">
  <div class="score-circle" id="final-score-circle"></div>
  <h2>Terminé !</h2>
  <p id="final-msg"></p>
  <button class="btn-restart" onclick="restart()">Recommencer</button>
</div>

<script>
const NIVEAU_COLORS = {
  1: "#8fd6a3",
  2: "#7fd0e0",
  3: "#b7aef0",
  4: "#f2c07a",
  5: "#f29a9a"
};

const exercises = [
  // ---------- Niveau 1 : échauffement (réponse en m) ----------
  {
    niveau: 1, etoiles: "★", unit: "m",
    icon: "🚗",
    title: "Échauffement — une voiture",
    statement: "Une voiture roule à <span class='val'>10 m/s</span> pendant <span class='val'>5 s</span>. Quelle distance parcourt-elle (<span class='unit-ask'>en m</span>) ?",
    hint: "d = v × t. Ici tout est déjà en m/s et en s, pas de conversion à faire.",
    hint2: "d = 10 × 5",
    answer: 50, tol: 0.5,
    explanation: "d = 10 × 5 = <b>50 m</b>"
  },
  {
    niveau: 1, etoiles: "★", unit: "m",
    icon: "🚴",
    title: "Échauffement — un cycliste",
    statement: "Un cycliste roule à <span class='val'>3 m/s</span> pendant <span class='val'>6 s</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "d = v × t.",
    hint2: "d = 3 × 6",
    answer: 18, tol: 0.3,
    explanation: "d = 3 × 6 = <b>18 m</b>"
  },
  {
    niveau: 1, etoiles: "★", unit: "m",
    icon: "🏃",
    title: "Échauffement — un coureur",
    statement: "Un coureur court à <span class='val'>8 m/s</span> pendant <span class='val'>4 s</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "d = v × t.",
    hint2: "d = 8 × 4",
    answer: 32, tol: 0.3,
    explanation: "d = 8 × 4 = <b>32 m</b>"
  },

  // ---------- Niveau 2 : nombres moins ronds (réponse en m) ----------
  {
    niveau: 2, etoiles: "★★", unit: "m",
    icon: "🚙",
    title: "Nombres moins ronds — une voiture",
    statement: "Une voiture roule à <span class='val'>12 m/s</span> pendant <span class='val'>7 s</span>. Quelle distance parcourt-elle (<span class='unit-ask'>en m</span>) ?",
    hint: "Toujours la même formule, mais la multiplication est un peu moins évidente.",
    hint2: "d = 12 × 7",
    answer: 84, tol: 0.5,
    explanation: "d = 12 × 7 = <b>84 m</b>"
  },
  {
    niveau: 2, etoiles: "★★", unit: "m",
    icon: "🐌",
    title: "Nombres moins ronds — un escargot",
    statement: "Un escargot avance à <span class='val'>0,5 m/s</span> pendant <span class='val'>6 s</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "v est un nombre décimal, mais le calcul reste d = v × t.",
    hint2: "d = 0,5 × 6",
    answer: 3, tol: 0.2,
    explanation: "d = 0,5 × 6 = <b>3 m</b>"
  },
  {
    niveau: 2, etoiles: "★★", unit: "m",
    icon: "🚄",
    title: "Nombres moins ronds — un TGV",
    statement: "Un TGV roule à <span class='val'>25 m/s</span> pendant <span class='val'>9 s</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "d = v × t.",
    hint2: "d = 25 × 9",
    answer: 225, tol: 1,
    explanation: "d = 25 × 9 = <b>225 m</b>"
  },

  // ---------- Niveau 3 : une conversion de temps (réponse variée m/km) ----------
  {
    niveau: 3, etoiles: "★★★", unit: "m",
    icon: "🐢",
    title: "Une conversion — une tortue",
    statement: "Une tortue avance à <span class='val'>0,02 m/s</span> pendant <span class='val'>5 min</span>. Quelle distance parcourt-elle (<span class='unit-ask'>en m</span>) ?",
    hint: "Convertis d'abord les minutes en secondes avant de multiplier.",
    hint2: "5 min = 300 s → d = 0,02 × 300",
    answer: 6, tol: 0.3,
    explanation: "5 min = 300 s → d = 0,02 × 300 = <b>6 m</b>"
  },
  {
    niveau: 3, etoiles: "★★★", unit: "km",
    icon: "🛵",
    title: "Une conversion — un scooter",
    statement: "Un scooter roule à <span class='val'>15 m/s</span> pendant <span class='val'>2 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en km</span>) ?",
    hint: "Convertis d'abord les minutes en secondes. Calcule d'abord en m, puis repasse en km à la fin.",
    hint2: "2 min = 120 s → d = 15 × 120 = 1800 m = 1,8 km",
    answer: 1.8, tol: 0.05,
    explanation: "2 min = 120 s → d = 15 × 120 = 1800 m = <b>1,8 km</b>"
  },
  {
    niveau: 3, etoiles: "★★★", unit: "m",
    icon: "🏊",
    title: "Une conversion — un nageur",
    statement: "Un nageur nage à <span class='val'>0,8 m/s</span> pendant <span class='val'>3 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "Convertis d'abord les minutes en secondes.",
    hint2: "3 min = 180 s → d = 0,8 × 180",
    answer: 144, tol: 1,
    explanation: "3 min = 180 s → d = 0,8 × 180 = <b>144 m</b>"
  },

  // ---------- Niveau 4 : deux conversions (réponse variée m/km) ----------
  {
    niveau: 4, etoiles: "★★★★", unit: "m",
    icon: "🚗",
    title: "Deux conversions — une voiture",
    statement: "Une voiture roule à <span class='val'>36 km/h</span> pendant <span class='val'>5 min</span>. Quelle distance parcourt-elle (<span class='unit-ask'>en m</span>) ?",
    hint: "Convertis la vitesse en m/s ET le temps en secondes avant de multiplier.",
    hint2: "36 km/h = 10 m/s · 5 min = 300 s → d = 10 × 300",
    answer: 3000, tol: 10,
    explanation: "36 km/h = 10 m/s, 5 min = 300 s → d = 10 × 300 = <b>3000 m</b>"
  },
  {
    niveau: 4, etoiles: "★★★★", unit: "km",
    icon: "🚌",
    title: "Deux conversions — un bus",
    statement: "Un bus roule à <span class='val'>54 km/h</span> pendant <span class='val'>2 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en km</span>) ?",
    hint: "Convertis la vitesse en m/s ET le temps en secondes. Calcule en m, puis repasse en km.",
    hint2: "54 km/h = 15 m/s · 2 min = 120 s → d = 15 × 120 = 1800 m = 1,8 km",
    answer: 1.8, tol: 0.05,
    explanation: "54 km/h = 15 m/s, 2 min = 120 s → d = 15 × 120 = 1800 m = <b>1,8 km</b>"
  },
  {
    niveau: 4, etoiles: "★★★★", unit: "m",
    icon: "🚆",
    title: "Deux conversions — un train",
    statement: "Un train roule à <span class='val'>72 km/h</span> pendant <span class='val'>10 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en m</span>) ?",
    hint: "Convertis la vitesse en m/s ET le temps en secondes.",
    hint2: "72 km/h = 20 m/s · 10 min = 600 s → d = 20 × 600",
    answer: 12000, tol: 20,
    explanation: "72 km/h = 20 m/s, 10 min = 600 s → d = 20 × 600 = <b>12 000 m</b>"
  },

  // ---------- Niveau 5 : défi (heures + minutes, réponse en km) ----------
  {
    niveau: 5, etoiles: "★★★★★", unit: "km",
    icon: "🚘",
    title: "Défi — une voiture (h + min)",
    statement: "Une voiture roule à <span class='val'>90 km/h</span> pendant <span class='val'>3 h et 20 min</span>. Quelle distance parcourt-elle (<span class='unit-ask'>en km</span>) ?",
    hint: "Convertis la vitesse en m/s, et les h + min en secondes (1 h = 3600 s). Calcule en m, puis repasse en km.",
    hint2: "90 km/h = 25 m/s · 3h20 = 3×3600 + 20×60 = 12 000 s → d = 25 × 12 000 = 300 000 m = 300 km",
    answer: 300, tol: 3,
    explanation: "90 km/h = 25 m/s, 3 h 20 min = 12 000 s → d = 25 × 12 000 = 300 000 m = <b>300 km</b>"
  },
  {
    niveau: 5, etoiles: "★★★★★", unit: "km",
    icon: "🚛",
    title: "Défi — un camion (h + min)",
    statement: "Un camion roule à <span class='val'>72 km/h</span> pendant <span class='val'>2 h et 30 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en km</span>) ?",
    hint: "Convertis la vitesse en m/s, et les h + min en secondes.",
    hint2: "72 km/h = 20 m/s · 2h30 = 2×3600 + 30×60 = 9 000 s → d = 20 × 9 000 = 180 000 m = 180 km",
    answer: 180, tol: 2,
    explanation: "72 km/h = 20 m/s, 2 h 30 min = 9 000 s → d = 20 × 9 000 = 180 000 m = <b>180 km</b>"
  },
  {
    niveau: 5, etoiles: "★★★★★", unit: "km",
    icon: "✈️",
    title: "Défi — un avion (h + min)",
    statement: "Un avion vole à <span class='val'>360 km/h</span> pendant <span class='val'>1 h et 45 min</span>. Quelle distance parcourt-il (<span class='unit-ask'>en km</span>) ?",
    hint: "Convertis la vitesse en m/s, et les h + min en secondes.",
    hint2: "360 km/h = 100 m/s · 1h45 = 3600 + 45×60 = 6 300 s → d = 100 × 6 300 = 630 000 m = 630 km",
    answer: 630, tol: 5,
    explanation: "360 km/h = 100 m/s, 1 h 45 min = 6 300 s → d = 100 × 6 300 = 630 000 m = <b>630 km</b>"
  }
];

let current = 0, score = 0, checked = false, hintLevel = 0;

function renderExercise() {
  const ex = exercises[current];
  checked = false; hintLevel = 0;
  document.getElementById('step-badge').textContent = `Étape ${current+1}`;
  const nb = document.getElementById('niveau-badge');
  nb.textContent = `Niveau ${ex.niveau} ${ex.etoiles}`;
  nb.style.background = NIVEAU_COLORS[ex.niveau];
  document.getElementById('ex-title').textContent = `${ex.icon} ${ex.title}`;
  document.getElementById('ex-statement').innerHTML = ex.statement;
  document.getElementById('unit-label').textContent = `d (${ex.unit})`;

  const inp = document.getElementById('inp_ans');
  inp.value = '';
  inp.placeholder = `… ${ex.unit}`;
  inp.classList.remove('ok','err');
  document.getElementById('fb_ans').textContent = '';
  document.getElementById('fb_ans').className = 'inline-feedback';

  document.getElementById('global-fb').className = 'global-feedback';
  document.getElementById('global-fb').textContent = '';
  document.getElementById('btn-next').style.display = 'none';
  updateProgress();
  inp.focus();
}

function updateProgress() {
  document.getElementById('prog-label').textContent = `Exercice ${current+1} / ${exercises.length}`;
  document.getElementById('prog-score').textContent = `${score} point(s)`;
  document.getElementById('prog-fill').style.width = `${(current/exercises.length)*100}%`;
}

function checkAnswers() {
  if (checked) return;
  const ex = exercises[current];
  const inp = document.getElementById('inp_ans');
  const fb = document.getElementById('fb_ans');
  const v = parseFloat(inp.value);
  const gfb = document.getElementById('global-fb');

  if (!isNaN(v) && Math.abs(v - ex.answer) <= ex.tol) {
    inp.classList.add('ok'); inp.classList.remove('err');
    fb.textContent = '✓ Correct !'; fb.className = 'inline-feedback ok';
    score++; checked = true;
    gfb.innerHTML = '🎉 Bravo ! ' + ex.explanation;
    gfb.className = 'global-feedback ok';
    document.getElementById('btn-next').style.display = 'block';
    updateProgress();
  } else {
    inp.classList.add('err'); inp.classList.remove('ok');
    fb.textContent = isNaN(v) ? '⚠ Entre une valeur' : '✗ Pas encore… (vérifie l\'unité demandée)';
    fb.className = 'inline-feedback err';
    gfb.textContent = "🤔 Pas encore… Relis l'indice et réessaie !";
    gfb.className = 'global-feedback err';
  }
}

function showHint() {
  const ex = exercises[current];
  const gfb = document.getElementById('global-fb');
  gfb.innerHTML = '💡 ' + (hintLevel === 0 ? ex.hint : ex.hint2);
  gfb.className = 'global-feedback info';
  hintLevel = (hintLevel + 1) % 2;
}

function nextExercise() {
  current++;
  if (current >= exercises.length) showScore();
  else renderExercise();
}

function showScore() {
  document.getElementById('exercise-card').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  const pct = Math.round((score / exercises.length) * 100);
  document.getElementById('final-score-circle').textContent = `${score}/${exercises.length}`;
  const msg = pct >= 80 ? "Excellent ! Tu maîtrises le calcul de distance 🚀"
             : pct >= 50 ? "Bien ! Relis les exemples pour consolider les conversions."
             : "Continue à t'entraîner, tu vas y arriver ! 💪";
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-score').textContent = `${score} point(s)`;
}

function restart() {
  current = 0; score = 0;
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('exercise-card').style.display = 'block';
  renderExercise();
}

renderExercise();
</script>
</body>
</html>
